[workspace]
members = ["crates/desktop-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/enzimo/universal-agents-desktop"

[workspace.dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# Apple's `strip` from Command Line Tools 27 (installed on the build Mac
# 2026-09-24) writes proc-macro dylibs that rustc and dyld cannot load, so
# Cargo's default release `strip = "debuginfo"` fails macOS release builds
# with "can't find crate for `thiserror_impl`". Build scripts and proc macros
# are never shipped; the application binary is still stripped.
[profile.release.build-override]
strip = false
