name: Windows and Linux builds

on:
  push:
    branches: [main, "platform/*"]
    paths-ignore: ['**/*.md', 'docs/**', 'compatible-runtimes.json']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'compatible-runtimes.json']
  workflow_dispatch:
    inputs:
      package:
        description: Build installers as well as compiling and testing
        type: boolean
        default: true
  workflow_call:
    inputs:
      package:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: rtk proxy bash --noprofile --norc -e -o pipefail {0}

jobs:
  native:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, Windows, X64, ua-build, ua-windows]
            shell: rtk proxy powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$ErrorActionPreference = 'Stop'; $global:LASTEXITCODE = 0; & ([ScriptBlock]::Create([IO.File]::ReadAllText('{0}'))); exit $LASTEXITCODE"
            label: Windows x64
            artifact: windows-x64
            timeout_minutes: 90
          - runner: [self-hosted, Linux, X64, ua-build, ua-linux]
            shell: rtk proxy bash --noprofile --norc -e -o pipefail {0}
            label: Linux x64
            artifact: linux-x64
            timeout_minutes: 45
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    # Windows debug tests, Clippy and popup checks can consume 45 minutes on the
    # shared host before the separate optimized application build even starts.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      - name: Require managed local runner
        run: node -e "if (process.env.UA_CI_HOOK_VERSION !== '1' || process.env.UA_CI_PUBLIC_JOB_POLICY_VERSION !== '1' || process.env.UA_CI_BUILD_CACHE_VERSION !== '1') throw new Error('Install the reviewed CI cleanup hooks before running jobs')"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Ensure pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --no-self-update --component clippy
      - name: Check provisioned Linux dependencies
        if: runner.os == 'Linux'
        run: pkg-config --modversion webkit2gtk-4.1
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test launcher UI
        run: node --test ui/desktop-shell/app.test.cjs
      - name: Test native popups on Windows
        if: runner.os == 'Windows'
        run: ./.github/scripts/windows-popup-smoke.ps1
      - name: Test native popups on Linux
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: xvfb-run -a dbus-run-session -- cargo run -p universal-agents-desktop --example popup_smoke --locked
      - name: Compile native application on pull requests
        if: github.event_name == 'pull_request' || (github.event_name != 'push' && !inputs.package)
        run: node .github/scripts/tauri-build.cjs --no-bundle
      - name: Build native installers
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.package)
        run: node .github/scripts/tauri-build.cjs
      - name: Upload development installers
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || inputs.package)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          retention-days: 3
          name: universal-agents-${{ matrix.artifact }}-development
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
