[[permission]]
identifier = "runtime-control"
description = "Allows the bundled Status window to inspect and control the desktop-managed Universal Agents runtime."
commands.allow = [
  "registry_access",
  "begin_github_login",
  "runtime_status",
  "desktop_version",
  "check_runtime_updates",
  "download_runtime_update",
  "install_runtime_update",
  "review_runtime_version",
  "open_release_page",
  "open_ua_repository",
  "docker_prerequisite",
  "start_runtime",
  "stop_runtime",
  "restart_runtime",
  "recent_logs",
  "download_diagnostics",
  "integration_status",
  "set_external_skill_refresh",
  "set_unlisted_runtime_offers",
  "choose_workspace",
  "use_internal_workspace",
  "connect_openai_subscription",
  "finish_openai_subscription",
  "cancel_openai_subscription_import",
  "open_webchat_window",
  "open_webchat_browser",
  "open_docs_browser",
  "open_docker_help",
  "open_workspace_folder",
  "quit_desktop_app",
  "stop_runtime_and_quit",
  "autostart_status",
  "set_autostart",
]
