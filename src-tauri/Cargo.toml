[package]
name = "universal-agents-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "universal_agents_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "universal-agents-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
log.workspace = true
serde.workspace = true
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-log = "=2.9.1"
tauri-plugin-opener = "=2.5.5"
tauri-plugin-single-instance = "=2.4.4"
ua-desktop-core = { path = "../crates/desktop-core" }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true

[features]
ui-test = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies.tauri-plugin-wdio-webdriver]
version = "=1.4.0"
optional = true

[[example]]
name = "ui_driver"
required-features = ["ui-test"]

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "=2.0.2"

[target.'cfg(windows)'.dev-dependencies]
windows = "=0.61.3"
